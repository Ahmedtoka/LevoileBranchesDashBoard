<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سيميوليتر الإدارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3f5;--surface:#ffffff;--surface-2:#faf7f9;--ink:#231c20;--muted:#726571;--line:#e9e0e6;--line-2:#f1eaef;
  --brand:#9c1e6e;--brand-ink:#7a1656;--brand-soft:#f7e7f0;
  --std:#1f4fd1;--std-soft:#e8eefc;--mine:#0f7b5a;--mine-soft:#e2f4ec;
  --warn:#b45309;--warn-soft:#fdf0dd;--danger:#b3261e;--danger-soft:#fbe9e7;--skin:#e7b48f;--night:#0b0709;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141015;--surface:#1d171c;--surface-2:#231b21;--ink:#f4eef2;--muted:#b2a3ad;--line:#372c34;--line-2:#2c232a;
  --brand:#e478bf;--brand-ink:#f3a6d9;--brand-soft:#3a1f31;--std:#8fb0ff;--std-soft:#1d2946;--mine:#5fd3a6;--mine-soft:#163227;
  --warn:#f0b061;--warn-soft:#3a2a14;--danger:#f28b82;--danger-soft:#3c1d1a;--skin:#d9a57f;--night:#050305;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141015;--surface:#1d171c;--surface-2:#231b21;--ink:#f4eef2;--muted:#b2a3ad;--line:#372c34;--line-2:#2c232a;
  --brand:#e478bf;--brand-ink:#f3a6d9;--brand-soft:#3a1f31;--std:#8fb0ff;--std-soft:#1d2946;--mine:#5fd3a6;--mine-soft:#163227;
  --warn:#f0b061;--warn-soft:#3a2a14;--danger:#f28b82;--danger-soft:#3c1d1a;--skin:#d9a57f;--night:#050305;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 0;display:flex;flex-direction:column;min-height:100vh}
.stage{order:1}.case{order:2;margin:12px 0 0!important}.thread{order:3}.controls{order:4;margin-top:auto!important}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:12px}
.top h1{margin:0;font-size:1.4rem;line-height:1.3;flex:1 1 300px}
.top h1 small{display:block;font-size:.88rem;font-weight:400;color:var(--muted);margin-top:3px}
.top a{color:var(--brand-ink);font-size:.86rem;font-weight:600;text-decoration:none;white-space:nowrap}
.top a:hover{text-decoration:underline}

.depts{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.depts button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.86rem;font-weight:500;min-height:36px}
.depts button:hover{border-color:var(--brand)}
.depts button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}

.depts button.special{border-style:dashed;font-weight:600}
.depts button.robot{border-color:var(--std);color:var(--std);border-style:solid;font-weight:700}
.depts button.robot[aria-pressed="true"]{background:var(--std);color:var(--surface)}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}.exs:empty{display:none}
.exs button{border:0;background:transparent;border-bottom:2px solid transparent;padding:3px 10px;font-size:.84rem;color:var(--muted);min-height:32px}
.exs button[aria-pressed="true"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.badge.planned{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}.badge.live{background:var(--mine-soft);color:var(--mine);border:1px solid var(--mine)}.badge.illustrative{background:var(--line-2);color:var(--muted);border:1px dashed var(--muted)}
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n,6),1fr);margin:6px 0 14px;padding:0;list-style:none}
.rail::before,.rail .fill{content:"";position:absolute;top:17px;height:3px;border-radius:2px}
.rail::before{inset-inline:var(--inset,8.33%);background:var(--line)}
.rail .fill{inset-inline-start:var(--inset,8.33%);width:calc(var(--p,0)*(100% - 2*var(--inset,8.33%)));background:var(--brand)}
.rail li{position:relative;text-align:center}
.rail button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;cursor:pointer;padding-bottom:2px;border-radius:8px}
.rail button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rail .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.92rem;background:var(--surface);border:2px solid var(--line);color:var(--muted);transition:background .3s,border-color .3s,color .3s,transform .3s}
.rail .lbl{font-size:.86rem;font-weight:600;color:var(--muted)}
.rail .q{font-size:.76rem;color:var(--muted)}
.rail .done .dot{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.rail .cur .dot{background:var(--brand);border-color:var(--brand);color:var(--surface);transform:scale(1.12)}
.rail .cur .lbl{color:var(--ink)}

.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:2px 18px;align-items:start}
.case h2{margin:0;font-size:1.04rem;line-height:1.45}
.case .meta{font-size:.82rem;color:var(--muted);text-align:end}
.case blockquote{grid-column:1/-1;margin:3px 0 0;font-size:.9rem;color:var(--ink);padding-inline-start:10px;border-inline-start:3px solid var(--brand)}
.case .ref{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:3px}
.case .note{grid-column:1/-1;margin-top:6px;font-size:.84rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 10px;font-weight:500}

.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:stretch}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;min-height:0;align-self:start}
.scene svg{display:block;width:100%;height:auto}
.scrub{position:relative;padding:8px 14px 10px;background:var(--surface);border-top:1px solid var(--line)}
.scrub input{display:block;width:100%;margin:0;accent-color:var(--brand);height:22px;cursor:pointer}
.scrub .ticks{position:absolute;inset-inline:14px;top:2px;height:6px;pointer-events:none}
.scrub .ticks i{position:absolute;top:0;width:2px;height:6px;background:var(--muted);transform:translateX(50%)}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.story .eyebrow{font-size:.8rem;font-weight:600;color:var(--brand-ink)}
.story h3{margin:0;font-size:1.18rem;line-height:1.4}
.story p{margin:0;font-size:.95rem}
.src{font-size:.78rem;color:var(--muted)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.badge.recorded{background:var(--brand-soft);color:var(--brand-ink)}
.badge.standard{background:var(--std-soft);color:var(--std)}
.badge.proposed{background:var(--mine-soft);color:var(--mine)}
.badge.target{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.detail{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:6px;font-size:.88rem}
.detail li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two h4,.kicker{margin:0 0 4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.two .detail li{flex-direction:column;gap:2px;align-items:flex-start}
.evidence{margin:0;background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:7px 11px;font-size:.92rem;font-weight:500}
.ticket{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;margin:0}
.ticket dt{color:var(--muted)}
.ticket dd{margin:0;font-weight:500}
.kpi{display:grid;gap:6px}
.kpi>div{display:grid;grid-template-columns:1fr auto;gap:0 10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 11px}
.kpi b{font-size:.9rem;font-weight:600}
.kpi .v{font-size:1.02rem;font-weight:700;text-align:end;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.kpi .n{font-size:.78rem;color:var(--muted)}
.kpi .st{justify-self:end}
.loop{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:2px}

.controls{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;margin:12px -20px 0;padding:9px 20px;background:var(--bg);border-top:1px solid var(--line)}
.controls button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 16px;font-weight:600;min-height:42px;min-width:82px}
.controls button:hover:not(:disabled){border-color:var(--brand)}
.controls button:disabled{opacity:.45;cursor:default}
.controls #play{background:var(--brand);border-color:var(--brand);color:var(--surface);min-width:104px}
.timer{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:0;background:var(--brand)}
.where{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.thread{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.thread h3{margin:0 0 8px;font-size:.92rem;font-weight:600}
.thread ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.thread li{min-width:0}
.thread li button{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;cursor:pointer;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 9px;font-size:.82rem;line-height:1.45;overflow-wrap:anywhere;transition:opacity .3s,border-color .3s}
.thread li button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.thread li b{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
.thread li.future button{opacity:.38}
.thread li.cur button{border-color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.78rem;color:var(--muted);align-items:center}

@media (max-width:900px){
  .wrap{padding:12px 16px 0;display:flex;flex-direction:column;min-height:100vh}
  .top h1 small{display:none}
  .stage{order:1}
  .case{order:2;margin:12px 0 0}
  .thread{order:3}
  .controls{order:4;margin-top:auto!important}
  .top h1{font-size:1.15rem}
  .stage{grid-template-columns:minmax(0,1fr)}
  .rail .q{display:none}
  .rail .lbl{font-size:.72rem}
  .rail .dot{width:30px;height:30px;font-size:.8rem}
  .rail::before,.rail .fill{top:14px}
  .case{grid-template-columns:1fr}
  .case .meta{text-align:start}
  .thread ol{grid-template-columns:1fr 1fr}
  .controls{margin:12px -16px 0;padding:8px 16px;flex-wrap:wrap}
  .controls button{flex:1;min-width:0;padding:7px 8px}
  .timer{flex-basis:100%;order:5}
  .where{display:none}
}
@media (max-width:440px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* التخطيط: شاشة واحدة */
.wrap{max-width:none!important;margin:0;padding:8px 16px 8px;display:flex!important;flex-direction:column;gap:6px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin:0;flex-wrap:nowrap}
.top h1{flex:none;font-size:1rem;margin:0;white-space:nowrap}
.top .depts{flex:1;min-width:0;padding:2px}
.top .depts button{padding:3px 11px;min-height:30px;font-size:.8rem}
.bar{display:flex;align-items:center;gap:14px}
.bar .exs{flex:none;margin:0;flex-wrap:nowrap}
.bar .rail{flex:1;min-width:0;margin:0}
.rail .dot{width:28px;height:28px;font-size:.78rem}
.rail::before,.rail .fill{top:13px}
.rail .lbl{font-size:.76rem;line-height:1.2}.rail .q{display:none}
.controls{position:static;flex:none;margin:0!important;padding:0;border:0;background:none}
.controls button{min-height:36px;min-width:70px;padding:3px 10px;font-size:.84rem}
.controls #play{min-width:88px}
.where{display:none}
.story{background:none;border:0;padding:0 2px;display:block}
.story .eyebrow{display:inline-block;font-size:.76rem;margin-inline-end:10px}
.story h3{display:inline;font-size:clamp(1rem,2.1vh,1.3rem)}
.story p{margin:2px 0 0;font-size:clamp(.82rem,1.75vh,1rem);line-height:1.45}
.scene{order:0;background:var(--surface-2);display:flex;flex-direction:column;align-self:stretch;border-radius:12px;min-height:0}
#scene{flex:1;min-height:0;display:flex;justify-content:center}
#scene svg{height:100%;width:100%;max-height:100%}
.scrub{flex:none;padding:5px 14px 5px}.scrub input{height:16px}
.below{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0!important;overflow:auto;font-size:.82rem;display:flex;flex-direction:column;gap:6px;min-width:0}
.panel.case{display:block}.panel .ref,.panel .meta{text-align:start}
.case h2{font-size:.9rem}.case blockquote{font-size:.8rem}.case .note{font-size:.76rem;padding:3px 8px}
.thread{margin:0}.thread h3{font-size:.8rem;margin:0 0 4px}
.thread ol{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))!important;gap:5px}
.thread li button{padding:4px 7px;font-size:.74rem}
.legend{margin-top:6px;gap:4px}
.two{gap:6px}.detail{gap:4px;font-size:.78rem}.detail li{padding:3px 8px}
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;min-height:0}
  .scene{flex:1 1 0}
  .below{flex:none;height:clamp(96px,18vh,240px)}
}
@media (max-width:900px){
  .wrap{padding:8px 16px 0}
  .top{flex-wrap:wrap}.top h1{white-space:normal}.top .depts{flex-basis:100%;order:3}
  .bar{flex-wrap:wrap;gap:6px}.bar .exs{flex-basis:100%;overflow-x:auto}.bar .rail{flex-basis:100%}
  .controls{position:sticky;bottom:0;z-index:5;order:9;flex-basis:100%;display:flex;background:var(--bg);padding:6px 0}
  .controls button{flex:1}
  .below{grid-template-columns:minmax(0,1fr)}
  .scene{flex:none}#scene svg{height:auto}
  .wrap>.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0}
}
.subs{flex:none;min-height:2em;padding:3px 14px;text-align:center;font-weight:600;font-size:clamp(.9rem,2vh,1.15rem);background:var(--surface);border-top:1px solid var(--line)}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>من سطر في الدستور لرقم في اللوحة</h1>
    <nav class="depts" id="depts" aria-label="اختيار الإدارة"></nav>
    <a href="department-blueprint.standalone.html">← الدستور</a>
  </header>
  <div class="bar">
    <nav class="exs" id="exs" aria-label="أمثلة الإدارة"></nav>
    <ol class="rail" id="rail" aria-label="لوحة المراحل"></ol>
    <div class="controls">
      <button id="back" type="button">→ السابق</button>
      <button id="play" type="button" aria-pressed="false">▶ تشغيل</button>
      <button id="next" type="button">التالي ←</button>
      <span class="where" id="where"></span>
    </div>
  </div>
  <div class="story" id="story" aria-live="polite"></div>
  <main class="scene">
    <div id="scene"></div>
    <div class="subs" id="subs" aria-live="polite"></div>
    <div class="scrub"><div class="ticks" id="ticks"></div><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="التقدم في الفيلم"></div>
  </main>
  <section class="below">
    <div class="panel" id="details"></div>
    <div class="panel case" id="case"></div>
    <div class="panel thread">
      <h3>ملف الكيس: كل مرحلة بتسيب أثر</h3>
      <ol id="thread"></ol>
      <div class="legend">
        <span class="badge recorded">مسجل</span><span class="badge standard">معيار</span><span class="badge proposed">مقترح</span><span class="badge target">مستهدف</span><span class="badge live">شغال في السيستم</span><span class="badge planned">مرحلة جاية</span><span class="badge illustrative">توضيحي</span>
      </div>
    </div>
  </section>
</div>

    kit.burst(TX[h.b], HY, at + 1.25, { color: 'var(--brand)', n: 8, r: 36 });
  });
  var n2 = note(s2, 4, 'تاسك بين إدارتين', { stroke: 'var(--brand)', color: 'var(--brand-ink)' });
  kit.rise(n2, 1.2);
  kit.caption('المخالفة بتبقى تاسك في إدارة تانية', 2.0, 3);
  var n2b = note(s2, 4, 'مسجل: 124 · LV-0343', { stroke: 'var(--brand)', color: 'var(--brand-ink)' });
  kit.out(n2, 5.4, .3); kit.fade(n2b, 5.8);
  kit.caption('أربع تسليمات مسجلة في الملفات', 6.0, 2.6);
  var pr = HAND.filter(function (h) { return h.st !== 'recorded'; });
  pr.forEach(function (h, i) {
    var at = 7.8 + i * 1.2;
    kit.fade(n(s2, 'h_' + h.id), at, { d: .6 });
    var tk = token('var(--mine)');
    kit.fade(tk, at, { d: .15 });
    kit.along(tk, n(s2, 'j_' + h.id), at, 2.0);
    kit.out(tk, at + 2.0, .2);
  });
  var n2c = note(s2, 4, 'مقترح: HR → IT', { stroke: 'var(--mine)', color: 'var(--mine)', dash: true });
  kit.out(n2b, 8.6, .3); kit.fade(n2c, 9.0);
  kit.caption('المتقطع لسه مقترح: مش في أي ملف', 9.2, 2.6);
  kit.lookBack(11.0, 1.1);
  kit.rest(12.4);

  /* 3. الروبوت فوق الطبقات: شعاع على الخيوط، وشارة «شغال» أو «مرحلة جاية» جنب كل قدرة */
  kit.chapter(3); cur = 3;
  var s3 = scene(3, { threads: true, hands: true });
  var rb = kit.robot(3, 440, 92, { scale: .5 });
  kit.hide(rb.el); kit.fade(rb.el, .3, { d: .5 });
  var live = kit.add(3, '<rect x="60" y="48" width="196" height="36" rx="18" fill="var(--mine-soft)" stroke="var(--mine)" stroke-width="2.5"/>');
  kit.label(live, 158, 73, 'شغال في السيستم', { size: 22, fill: 'var(--mine)' });
  var plan = kit.add(3, '<rect x="520" y="48" width="130" height="36" rx="18" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 5"/>');
  kit.label(plan, 585, 73, 'مرحلة جاية', { size: 22, fill: 'var(--warn)' });
  kit.pop(live, .9); kit.pop(plan, 1.2);
  rb.scan(1.2, 1.6, 'var(--std)');
  kit.look(400, 225, 1.1, .4, 1.2);
  var a1 = note(s3, 3, 'يصنّف ويقترح الإدارة', { stroke: 'var(--mine)', color: 'var(--mine)' });
  rb.look(14, 2.6); rb.reach(2.6, -60);
  kit.to(n(s3, 't_cctv'), { attr: { 'stroke-width': 8 }, duration: .25, yoyo: true, repeat: 3 }, 2.7);
  var tk3 = token(col('cctv')); kit.fade(tk3, 2.8, { d: .15 }); kit.along(tk3, n(s3, 'j_cctv_ops'), 2.8, 2.0); kit.out(tk3, 4.8, .2);
  kit.rise(a1, 2.8);
  kit.ring(TX.cctv, BY(3) + 17, 2.9, { color: 'var(--mine)', r: 40, n: 1 });
  var a2 = note(s3, 4, 'تيكت بمهلة · تنبيه 8ص', { stroke: 'var(--mine)', color: 'var(--mine)' });
  kit.rise(a2, 4.0);
  rb.lower(4.0);
  var hg = kit.add(3, '<g><circle r="12" fill="var(--mine-soft)" stroke="var(--mine)" stroke-width="3"/><line x1="0" y1="0" x2="0" y2="-7" stroke="var(--mine)" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="5" y2="3" stroke="var(--mine)" stroke-width="3" stroke-linecap="round"/></g>');
  kit.hide(hg); kit.fade(hg, 4.2, { d: .2 });
  kit.along(hg, n(s3, 't_ops'), 4.2, 1.6);
  kit.out(hg, 5.8, .2);
  kit.caption('الروبوت بيقترح، والإنسان بيعتمد', 4.4, 2.8);
  var a3 = note(s3, 2, 'التكرار يرفع الخطورة', { stroke: 'var(--mine)', color: 'var(--mine)' });
  kit.rise(a3, 5.6);
  rb.alert(6.4);
  kit.shake(6.5, 5);
  var a4 = note(s3, 5, 'تحليل وتصعيد: جاية', { stroke: 'var(--warn)', color: 'var(--warn)', dash: true });
  kit.rise(a4, 7.2);
  rb.say('تصعيد: جاية', 7.4, 2.4, { left: true });
  kit.caption('التصعيد للمدير العام: مرحلة جاية', 7.8, 3);
  rb.calm(9.4);
  rb.glide(320, 9.6, 1.2); rb.scan(10.8, 1.4, 'var(--std)');
  kit.to(n(s3, 't_ops'), { attr: { 'stroke-width': 8 }, duration: .25, yoyo: true, repeat: 3 }, 11.0);
  kit.lookBack(10.6, 1.1);
  kit.rest(12.6);

  /* 4. الحلقة: سهم من المؤشر راجع للدستور، و376 سجل، ومفيش رقم تحسّن */
  kit.chapter(4); cur = 4;
  var s4 = scene(4, { threads: true, hands: true });
  var lp = kit.add(4, '<path data-n="p" d="M' + BX + ' ' + (BY(5) + 17) + ' C20 ' + (BY(5) + 17) + ', 20 ' + (BY(0) + 17) + ', ' + BX + ' ' + (BY(0) + 17) + '" fill="none" stroke="var(--std)" stroke-width="6" stroke-linecap="round"/>'
    + '<path data-n="a" d="M' + (BX - 2) + ' ' + (BY(0) + 17) + ' l-14 -9 l0 18 z" fill="var(--std)"/>');
  kit.hide(n(lp, 'a'));
  var n4 = note(s4, 5, '376 سجل في المصدر', { stroke: 'var(--std)', color: 'var(--std)' });
  var c4 = n4.querySelector('text');
  kit.rise(n4, .4);
  kit.count(c4, 0, 376, .5, 1.4, function (v) { return Math.round(v) + ' سجل في المصدر'; });
  kit.look(400, 225, 1.1, 1.6, 1.3);
  kit.draw(n(lp, 'p'), 1.6, 1.8);
  kit.pop(n(lp, 'a'), 3.4);
  kit.burst(BX, BY(0) + 17, 3.4, { color: 'var(--std)', n: 14, r: 70 });
  var tk4 = token('var(--std)');
  kit.fade(tk4, 4.6, { d: .15 });
  kit.along(tk4, n(lp, 'p'), 4.6, 1.4);
  kit.out(tk4, 6.0, .2);
  var n4b = note(s4, 0, 'نرجع نراجع القاعدة', { stroke: 'var(--std)', color: 'var(--std)' });
  kit.rise(n4b, 6.0);
  var n4c = note(s4, 4, 'التاسكات: لسه مقترحة', { stroke: 'var(--mine)', color: 'var(--mine)', dash: true });
  kit.fade(n4c, 6.8);
  kit.caption('المؤشر راجع للدستور: الحلقة مقفولة', 6.4, 3);
  kit.lookBack(8.6, 1.2);
  kit.rest(10.4);
};


</script>
<script>
(function(){
  var ORDER=['operation','lp','cctv','finance','hr','it','maintenance','stock_control','merchandise','vm'];
  var STAGES=[
    {id:'constitution',label:'الدستور',q:'إيه القاعدة؟'},
    {id:'sop',label:'الـ SOP',q:'تتنفذ إزاي؟'},
    {id:'checklist',label:'الشيك ليست',q:'مين بيتأكد؟'},
    {id:'violation',label:'المخالفة',q:'إيه اللي حصل؟'},
    {id:'task',label:'التاسك',q:'مين يصلّح؟'},
    {id:'kpi',label:'المؤشر',q:'بيتقاس بإيه؟'}
  ];
  var STATUS={recorded:'مسجل',standard:'معيار',proposed:'مقترح',target:'مستهدف'};
  var groups=[],prog=[];
  ORDER.forEach(function(k){
    var main=window.SIM_SCENES[k],ex=(window.SIM_EXTRA&&window.SIM_EXTRA[k])||{},g={name:main.name,first:prog.length,items:[]};
    function add(sc,tab){sc.group=groups.length;g.items.push({i:prog.length,tab:tab});prog.push(sc)}
    main.tab='مثال 1';add(main,'مثال 1');
    (ex.examples||[]).forEach(function(sc,n){add(sc,'مثال '+(n+2))});
    if(ex.rollup)add(ex.rollup,'KPI المجمّع');
    groups.push(g);
  });
  ((window.SIM_SPECIAL)||[]).forEach(function(sc){
    var g={name:sc.name,first:prog.length,items:[],special:sc.navClass||'special'};
    sc.group=groups.length;prog.push(sc);groups.push(g);
  });
  var sceneCss=document.createElement('style');
  sceneCss.textContent=prog.map(function(c){return c.css||''}).join('\n');
  document.head.appendChild(sceneCss);
  var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var p=0,s=0,playing=false,stopAt=null,kit=null,tl=null,times=[],railFor=null;
  var staticMode=false;
  var $=function(id){return document.getElementById(id)};
  var STATUS2={recorded:'مسجل',standard:'معيار',proposed:'مقترح',target:'مستهدف',live:'شغال في السيستم',planned:'مرحلة جاية',illustrative:'توضيحي'};
  function labels(sc){return sc.labels||STAGES}

  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function badge(st){return STATUS2[st]?'<span class="badge '+st+'">'+STATUS2[st]+'</span>':''}
  function items(list){return '<ul class="detail">'+(list||[]).map(function(i){return '<li><span>'+esc(i.t)+'</span>'+badge(i.status)+'</li>'}).join('')+'</ul>'}
  function kpiList(l){return '<div class="kpi">'+(l||[]).map(function(k){return '<div><b>'+esc(k.name)+'</b><span class="v">'+esc(k.value)+'</span><span class="n">'+esc(k.note)+'</span><span class="st">'+badge(k.status)+'</span></div>'}).join('')+'</div>'}

  function detail(st){
    var out='';
    if(st.steps)out+=items(st.steps);
    if(st.dept)out+='<div class="two"><div><h4>شيك ليست الإدارة</h4>'+items(st.dept)+'</div><div><h4>شيك ليست الفرع</h4>'+items(st.branch)+'</div></div>';
    if(st.evidence)out+='<p class="evidence">'+esc(st.evidence)+'</p>';
    if(st.ticket){var t=st.ticket;out+='<div class="kicker">التيكت الرسمي '+badge(t.status)+'</div><dl class="ticket"><dt>يفتحه</dt><dd>'+esc(t.opens)+'</dd><dt>ينفذه</dt><dd>'+esc(t.does)+'</dd><dt>يتقفل بـ</dt><dd>'+esc(t.closes)+'</dd><dt>SLA</dt><dd>'+esc(t.sla)+'</dd></dl>'}
    if(st.points)out+=items(st.points);
    if(st.kpis)out+=kpiList(st.kpis);
    if(st.combined)out+='<div class="kicker">المجمّع</div>'+kpiList(st.combined);
    if(st.id==='kpi')out+='<div class="loop">والحلقة بتقفل هنا: لو الرقم ما اتحركش، بنرجع نراجع الدستور والـ SOP.</div>';
    return out;
  }
  function renderNav(){
    var box=$('depts'),cur=prog[p].group;
    box.innerHTML=groups.map(function(g,i){return '<button type="button" class="'+(g.special||'')+'" data-g="'+i+'" aria-pressed="'+(i===cur)+'">'+esc(g.name)+'</button>'}).join('');
    var a=box.querySelector('[aria-pressed="true"]');
    if(a&&box.scrollWidth>box.clientWidth)box.scrollLeft+=a.getBoundingClientRect().left-box.getBoundingClientRect().left-box.clientWidth/2+a.offsetWidth/2;
    var its=groups[cur].items;
    $('exs').innerHTML=its.length>1?its.map(function(it){return '<button type="button" data-p="'+it.i+'" aria-pressed="'+(it.i===p)+'">'+esc(it.tab)+'</button>'}).join(''):'';
  }
  function renderRail(){
    var r=$('rail'),L=labels(prog[p]);
    if(railFor!==L){
      railFor=L;
      r.style.setProperty('--n',L.length);r.style.setProperty('--inset',(100/(2*L.length))+'%');
      r.innerHTML='<span class="fill"></span>'+L.map(function(m,i){
        return '<li><button type="button" data-s="'+i+'"><span class="dot">'+(i+1)+'</span><span class="lbl">'+esc(m.label)+'</span><span class="q">'+esc(m.q||'')+'</span></button></li>'
      }).join('');
    }
    [].forEach.call(r.querySelectorAll('li'),function(li,i){
      li.className=i===s?'cur':i<s?'done':'';
      li.firstChild.setAttribute('aria-current',i===s?'step':'false');
    });
  }
  function renderCase(){
    var c=prog[p].case;
    if(!c){$('case').innerHTML='';$('case').style.display='none';return}
    $('case').style.display='';
    $('case').innerHTML='<h2>'+esc(c.title)+'</h2><div class="meta">'+esc(c.branch)+(c.date?' · '+esc(c.date):'')+'</div>'+
      (c.quote?'<blockquote>'+esc(c.quote)+'</blockquote>':'')+(c.ref?'<div class="ref">المصدر: '+esc(c.ref)+'</div>':'')+
      (c.illustrative?'<div class="note">سيناريو توضيحي</div>':'')+(c.note?'<div class="note">'+esc(c.note)+'</div>':'');
  }
  function renderStory(){
    var sc=prog[p],st=sc.stages[s],L=labels(sc),m=L[s];
    if(staticMode&&st.svg)$('scene').innerHTML=st.svg;
    $('story').innerHTML='<div class="eyebrow">المرحلة '+(s+1)+' من '+L.length+' · '+esc(m.label)+' '+badge(st.status)+'</div><h3>'+esc(st.headline)+'</h3><p>'+esc(st.body)+'</p>';
    $('details').innerHTML=detail(st)+(st.src?'<div class="src">المصدر: '+esc(st.src)+'</div>':'');
    $('thread').innerHTML=sc.stages.map(function(x,i){
      return '<li class="'+(i===s?'cur':i>s?'future':'')+'"><button type="button" data-s="'+i+'"><b>'+esc(L[i].label)+'</b>'+(i>s?'…':esc(x.thread||''))+'</button></li>';
    }).join('');
    $('where').textContent=groups[sc.group].name+' · '+(s+1)+'/'+L.length;
    renderRail();
    try{history.replaceState(null,'','#'+sc.key+'/'+(s+1))}catch(e){}
    $('back').disabled=p===0&&s===0;
    $('next').disabled=p===prog.length-1&&s===L.length-1;
  }
  function chapterAt(t){for(var i=times.length-1;i>=0;i--)if(t>=times[i]-.001)return i;return 0}
  function onUpdate(){
    var t=tl.time(),c=chapterAt(t),n=times.length;
    if(stopAt!=null&&t>=stopAt){stopAt=null;tl.pause();}
    if(c!==s){s=c;renderStory()}
    var end=c<n-1?times[c+1]:tl.duration(),f=(t-times[c])/Math.max(.01,end-times[c]);
    $('rail').style.setProperty('--p',n>1?Math.min(1,(c+Math.max(0,Math.min(1,f)))/(n-1)):1);
    $('scrub').value=Math.round(tl.progress()*1000);
    var cp=kit?kit._caption(t):'';if($('subs').textContent!==cp)$('subs').textContent=cp;
  }
  function renderTicks(){
    var D=tl.duration();
    $('ticks').innerHTML=times.slice(1).map(function(t){return '<i style="inset-inline-start:'+(t/D*100)+'%"></i>'}).join('');
  }
  function load(np){
    if(kit){kit._kill();kit=null}else if(tl){tl.kill()}
    p=np;
    var sc=prog[p],film=(window.SIM_FILMS&&window.SIM_FILMS[sc.key])||(sc.film&&window.SimLib.example)||(sc.rollupFilm&&window.SimLib.rollup);
    var L=labels(sc);
    $('scene').innerHTML='<svg role="img" aria-label="'+esc((sc.case&&sc.case.title)||sc.name)+'"></svg>';
    staticMode=false;
    try{
      if(!film)throw new Error('no film');
      kit=SimFilm.create($('scene').firstChild,sc.key,{labels:L.map(function(x){return x.label}),noFinale:sc.noFinale||sc.rollupFilm,finaleCaption:sc.finaleCaption});
      film(kit,sc);kit._finish();
      tl=kit.tl;times=kit._chapterTimes();
    }catch(err){
      if(film)console.warn('film fallback',sc.key,err);
      staticMode=true;
      if(kit){kit._kill();kit=null}
      $('scene').innerHTML='';
      tl=gsap.timeline({paused:true});times=[];
      for(var i=0;i<L.length;i++){times.push(i*9);tl.addLabel('c'+i,i*9)}
      tl.set({},{},L.length*9);
    }
    tl.eventCallback('onUpdate',onUpdate);
    tl.eventCallback('onComplete',function(){
      if(playing&&p<prog.length-1)go(p+1,0);
      else setPlay(false);
    });
    renderNav();renderCase();renderTicks();
  }
  // بينقل لمرحلة: في التشغيل بيكمّل، وفي الإيقاف بيعرض المرحلة ويقف عند آخرها
  function go(np,ns){
    if(np!==p||!tl)load(np);
    s=ns;
    var endT=ns<times.length-1?times[ns+1]-.02:tl.duration();
    tl.pause();
    if(REDUCED){tl.seek(endT-.01,false);s=ns;renderStory();onUpdate();return}
    tl.seek(times[ns],false);
    renderStory();onUpdate();
    stopAt=playing?null:endT;
    tl.play();
  }
  function next(){if(s<times.length-1)go(p,s+1);else if(p<prog.length-1)go(p+1,0);else setPlay(false)}
  function back(){if(s>0)go(p,s-1);else if(p>0){load(p-1);go(p,times.length-1)}else go(0,0)}
  function setPlay(v){
    playing=v;
    $('play').textContent=v?'❚❚ إيقاف':'▶ تشغيل';
    $('play').setAttribute('aria-pressed',String(v));
    if(!tl)return;
    stopAt=null;
    if(v){if(tl.progress()>=1)tl.seek(0,false);if(!REDUCED)tl.play()}
    else tl.pause();
  }
  $('scrub').addEventListener('input',function(){if(playing)setPlay(false);stopAt=null;tl.pause();tl.progress(this.value/1000,false);onUpdate()});

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.g!==undefined)go(groups[+b.dataset.g].first,0);
    else if(b.dataset.p!==undefined)go(+b.dataset.p,0);
    else if(b.dataset.s!==undefined)go(p,+b.dataset.s);
    else if(b.id==='next')next();
    else if(b.id==='back')back();
    else if(b.id==='play'){
      if(!playing&&p===prog.length-1&&tl.progress()>=1)go(0,0);
      setPlay(!playing);
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,select,textarea'))return;
    if(e.key==='ArrowLeft'){next();e.preventDefault()}
    else if(e.key==='ArrowRight'){back();e.preventDefault()}
    else if(e.key===' '&&e.target.tagName!=='BUTTON'){setPlay(!playing);e.preventDefault()}
  });
  function fromHash(){
    var h=(location.hash||'').slice(1).split('/'),np=-1;
    prog.forEach(function(sc,i){if(sc.key===h[0])np=i});
    var hs=parseInt(h[1],10);
    return {p:np>=0?np:p,s:hs>=1?hs-1:0};
  }
  window.addEventListener('hashchange',function(){var t=fromHash();if(t.p!==p||t.s!==s){if(t.p!==p)load(t.p);go(t.p,Math.min(t.s,times.length-1))}});
  window.__sim={times:function(){return times},tl:function(){return tl}};
  var st0=fromHash();load(st0.p);go(st0.p,Math.min(st0.s,times.length-1));
})();
</script>
